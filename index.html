<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OurSecrets</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #050512;
      color: #f4f1f8;
      line-height: 1.65;
      font-size: 17px;
      overflow-x: hidden;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    h1 {
      font-size: clamp(1.85rem, 6vw, 3rem);
      margin: 0 0 8px;
      line-height: 1.15;
      font-weight: normal;
    }
    h2 {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      margin: 0 0 16px;
      font-weight: normal;
    }
    .sub {
      color: #c07cff;
      margin-bottom: 32px;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
    }
    .card {
      background: #0b0b22;
      border: 1px solid #252547;
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    a {
      color: #d8b4ff;
      text-decoration: none;
      word-break: break-word;
    }
    a:hover { text-decoration: underline; }
    ul {
      padding-left: 1.35em;
      margin: 0;
    }
    li { margin-bottom: 0.5em; }
    li:last-child { margin-bottom: 0; }
    .domain {
      color: #a89bb8;
      font-size: 0.95rem;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OurSecrets</h1>
    <div class="sub">Official policy pages</div>

    <div class="card">
      <h2>Legal &amp; support</h2>
      <ul>
        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms of Service</a></li>
        <li><a href="guidelines.html">Community Guidelines</a></li>
        <li><a href="child-safety.html">Child Safety Standards</a></li>
        <li><a href="contact.html">Contact / Support</a></li>
      </ul>
    </div>

    <p class="domain">
      <a href="https://oursecretsapp.com">oursecretsapp.com</a>
      &nbsp;·&nbsp;
      <a href="mailto:support@oursecretsapp.com">support@oursecretsapp.com</a>
    </p>
  </div>
</body>
</html>
